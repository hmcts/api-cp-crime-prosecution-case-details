name: Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/**/*.tf"
      - "infrastructure/**/*.tfvars"
      - "src/main/resources/openapi/**"
      - ".github/workflows/terraform-infra.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/**/*.tf"
      - "infrastructure/**/*.tfvars"
      - "src/main/resources/openapi/**"
      - ".github/workflows/terraform-infra.yaml"
  workflow_dispatch:
    inputs:
      overrideAction:
        description: "Run plan or apply"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  precheck:
    name: Terraform Precheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform format check
        uses: hmcts/cnp-githubactions-library/terraform-fmt@main
        with:
          working-directory: infrastructure
          recursive: true

  # Fails the run if the OpenAPI spec breaks consumers of the latest published release.
  # Nothing to compare before the first release. Gates the sandbox apply only.
  oasdiff:
    name: Breaking change check
    needs: [ precheck ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the latest release
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName -q '.[0].tagName')
          if [ -z "$latest" ]; then
            echo "No published release, nothing to compare"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing this spec with the latest release ${latest}"
          git worktree add base "$latest"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Fail on breaking changes
        if: steps.base.outputs.skip == 'false'
        uses: oasdiff/oasdiff-action/breaking@9e56cf8b3aff7edb326d5767d3d23f96127e20c3 # v0.1.21
        with:
          base: base/src/main/resources/openapi/openapi-spec.yml
          revision: src/main/resources/openapi/openapi-spec.yml
          fail-on: ERR
          # Keep the specs in CI: no upload to oasdiff.com and no PR comment.
          review: false
          github-token: ""

  discover-environments:
    name: Discover tfvars environments
    needs: precheck
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_envs: ${{ steps.matrix.outputs.has_envs }}
      sandbox_matrix: ${{ steps.matrix.outputs.sandbox_matrix }}
      has_sandbox: ${{ steps.matrix.outputs.has_sandbox }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build deployment matrix from tfvars files
        id: matrix
        shell: bash
        env:
          # prod is applied by terraform-release.yaml when a release is published, not here.
          SKIP_ENVS: "prod"
          # Environments gated by the breaking change check (the oasdiff job); everything else is not.
          SANDBOX_ENVS: "sbox"
        run: |
          set -euo pipefail

          matrix='[]'
          found="false"
          sandbox_matrix='[]'
          has_sandbox="false"

          for file in infrastructure/*.tfvars; do
            if [ ! -f "$file" ]; then
              continue
            fi

            env_name="${file%.tfvars}"
            env_name="${env_name#infrastructure/}"
            env_upper="$(echo "$env_name" | tr '[:lower:]-' '[:upper:]_')"

            if [[ " $SKIP_ENVS " == *" $env_name "* ]]; then
              continue
            fi

            storage_var="TFSTATE_STORAGE_ACCOUNT_NONPROD"

            item="$(jq -nc \
              --arg environment "$env_name" \
              --arg subscription_var "AZURE_SUBSCRIPTION_${env_upper}" \
              --arg storage_account_var "$storage_var" \
              --arg azure_client_id_var "AZURE_CLIENT_ID_${env_upper}" \
              --arg azure_subscription_id_var "AZURE_SUBSCRIPTION_ID_${env_upper}" \
              '{
                environment: $environment,
                subscription_var: $subscription_var,
                storage_account_var: $storage_account_var,
                azure_client_id_var: $azure_client_id_var,
                azure_subscription_id_var: $azure_subscription_id_var
              }')"

            if [[ " $SANDBOX_ENVS " == *" $env_name "* ]]; then
              sandbox_matrix="$(jq -nc --argjson m "$sandbox_matrix" --argjson i "$item" '$m + [$i]')"
              has_sandbox="true"
            else
              matrix="$(jq -nc --argjson m "$matrix" --argjson i "$item" '$m + [$i]')"
              found="true"
            fi
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_envs=$found" >> "$GITHUB_OUTPUT"
          echo "sandbox_matrix=$sandbox_matrix" >> "$GITHUB_OUTPUT"
          echo "has_sandbox=$has_sandbox" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform ${{ matrix.environment }}
    needs: [ discover-environments ]
    if: ${{ needs['discover-environments'].outputs.has_envs == 'true' && (
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.overrideAction == 'plan' || github.ref ==
      'refs/heads/main' ) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs['discover-environments'].outputs.matrix) }}

    uses: hmcts/cnp-githubactions-library/.github/workflows/terraform-deploy-openId.yaml@main
    with:
      environment: ${{ matrix.environment }}
      subscription: ${{ vars[matrix.subscription_var] }}
      aks-subscription: ${{ vars[matrix.subscription_var] }}
      storage-account: ${{ vars[matrix.storage_account_var] }}
      azure-client-id: ${{ vars[matrix.azure_client_id_var] }}
      azure-subscription-id: ${{ vars[matrix.azure_subscription_id_var] }}
      state-store-resource-group: rg-sps-platform-${{ matrix.environment }}
      state-store-account-name: spsapimapi${{matrix.environment}}state
      state-store-container-name: terraform-state
      state-store-use-entra-id-auth: true
      working-directory: infrastructure
      plan-only: ${{ github.event_name == 'pull_request' || (github.event_name ==
        'workflow_dispatch' && github.event.inputs.overrideAction == 'plan') }}
      product: cp-crime-prosecution-case-details
      post-plan-to-pr: true

  # Same as terraform, but only for the sandbox and only after the breaking change check passes.
  terraform-sandbox:
    name: Terraform ${{ matrix.environment }}
    needs: [ discover-environments, oasdiff ]
    if: ${{ needs['discover-environments'].outputs.has_sandbox == 'true' && (
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.overrideAction == 'plan' || github.ref ==
      'refs/heads/main' ) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs['discover-environments'].outputs.sandbox_matrix) }}

    uses: hmcts/cnp-githubactions-library/.github/workflows/terraform-deploy-openId.yaml@main
    with:
      environment: ${{ matrix.environment }}
      subscription: ${{ vars[matrix.subscription_var] }}
      aks-subscription: ${{ vars[matrix.subscription_var] }}
      storage-account: ${{ vars[matrix.storage_account_var] }}
      azure-client-id: ${{ vars[matrix.azure_client_id_var] }}
      azure-subscription-id: ${{ vars[matrix.azure_subscription_id_var] }}
      state-store-resource-group: rg-sps-platform-${{ matrix.environment }}
      state-store-account-name: spsapimapi${{matrix.environment}}state
      state-store-container-name: terraform-state
      state-store-use-entra-id-auth: true
      working-directory: infrastructure
      plan-only: ${{ github.event_name == 'pull_request' || (github.event_name ==
        'workflow_dispatch' && github.event.inputs.overrideAction == 'plan') }}
      product: cp-crime-prosecution-case-details
      post-plan-to-pr: true
